[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judy-desktop"
version = "0.1.0"
description = "Judy — Local-first executive desktop AI assistant for Windows"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "requests>=2.32",
    "platformdirs>=4.2",
    "keyring>=25.2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "watchdog>=4.0",
    "sounddevice>=0.5",
    "SpeechRecognition>=3.10",
    "pyttsx3>=2.90",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "edge-tts>=7.0.0",
    "gTTS>=2.5.0"
]

[project.optional-dependencies]
voice = ["sounddevice>=0.5", "SpeechRecognition>=3.10", "pyttsx3>=2.90"]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pyinstaller>=6.10"]

[project.scripts]
judy = "judy.main:main"
jarvis = "judy.main:main"

[tool.setuptools.packages.find]
where = ["src"]
